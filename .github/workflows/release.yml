# vim: set ft=yaml fenc=utf-8 ff=unix sw=2 ts=2 et :
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create .env
        shell: bash
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" > .env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env

      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          ./build.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Create zip
        shell: pwsh
        run: |
          Compress-Archive `
            -Path out\gcalntfy.exe, gcalntfy.toml, src\sound.wav, src\app.ico `
            -DestinationPath "out\gcalntfy-${{ steps.version.outputs.version }}-x64.zip" `
            -Force

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "out/gcalntfy-${{ steps.version.outputs.version }}-x64.zip" \
            --title "$GITHUB_REF_NAME" \
            --draft
