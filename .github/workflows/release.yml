# vim: set ft=yaml fenc=utf-8 ff=unix sw=2 ts=2 et :
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Extract version
        id: version
        shell: bash
        run: echo "version=${GITHUB_EVENT_RELEASE_TAG_NAME#v}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}

      - name: Create .env
        shell: bash
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" > .env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> .env

      - name: Install vcpkg packages
        run: vcpkg install ebur128:x64-windows-static

      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          ./build.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Create zip
        shell: pwsh
        run: |
          Compress-Archive `
            -Path out\gcalntfy.exe, gcalntfy.toml, src\sound.wav, src\app.ico `
            -DestinationPath "out\gcalntfy-${{ steps.version.outputs.version }}-x64.zip" `
            -Force

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh release upload "$TAG" \
            "out/gcalntfy-${VERSION}-x64.zip" \
            --clobber
