# vim: set ft=toml fenc=utf-8 ff=unix sw=4 ts=4 et :
##################################################
# gcalntfy 設定ファイル
##################################################

# API エンドポイント URL
# GAS Web App のデプロイ URL。必須設定。
# 空文字の場合はポーリングが実行されない。
api_url = ""

# API トークン
# GAS Web App の setupApiToken 関数で設定した認証トークン。必須設定。
# 空文字の場合はポーリングが実行されない。
api_token = ""

# ポーリング回数（回/時）
# 0時〜23時の各時間帯の1時間あたりポーリング回数を24要素の配列で指定する。
# 正時（毎時0分）を起点に等間隔でポーリングする。0 を指定した時間帯はポーリングしない。
schedule = [1, 1, 1, 1, 1, 1, 1, 6, 6, 6, 6, 6, 6, 6, 6, 6, 6, 6, 6, 3, 3, 3, 1, 1]

# ダッキング対象プロセス
# 通知音再生中にミュートするプロセス名の配列。
# コメントアウトまたは空配列でダッキング無効。
# duck_targets = ["chrome.exe", "msedge.exe"]
