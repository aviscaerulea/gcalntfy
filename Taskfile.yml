# vim: set ft=yaml fenc=utf-8 ff=unix sw=2 ts=2 et :
$schema: https://taskfile.dev/schema.json
version: '3'

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo 0.0.0-dev

tasks:
  default:
    desc: クリーンビルドを実行する。
    cmds:
      - task clean
      - task build

  clean:
    desc: ビルド成果物を削除
    cmds:
      - rm -rf out

  build:
    desc: gcalntfy をビルド
    cmds:
      - taskkill //F //IM gcalntfy.exe 2>/dev/null || true
      - mkdir -p out
      - pwsh -NonInteractive -File build.ps1 -Version {{.VERSION}}
      - cp gcalntfy.toml out/
      - cp src/sound.wav out/
      - cp src/app.ico out/
      - cp -f *.local.* out/ 2>/dev/null || true

  release:
    desc: リリースビルドと zip 作成
    deps: [build]
    cmds:
      - >-
        pwsh -NonInteractive -Command '
        Compress-Archive
        -Path out\gcalntfy.exe, gcalntfy.toml, out\sound.wav, out\app.ico
        -DestinationPath "out\gcalntfy-{{.VERSION}}-x64.zip"
        -Force'

  rebuild:
    desc: 実行中のバイナリを停止し、クリーンビルドして再起動する
    cmds:
      - cmd: taskkill //F //IM gcalntfy.exe
        ignore_error: true
      - task: clean
      - task: build
      - pwsh.exe -NoProfile -Command "Start-Process 'out/gcalntfy.exe'"
